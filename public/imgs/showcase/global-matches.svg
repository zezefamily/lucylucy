<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="12" fill="#F9FAFB"/>
  <rect x="50" y="50" width="500" height="300" rx="8" fill="#F3F4F6"/>
  
  <!-- 世界地图轮廓 -->
  <rect x="150" y="120" width="300" height="160" rx="8" fill="#E5E7EB"/>
  
  <!-- 连接点 -->
  <circle cx="200" cy="150" r="8" fill="#10B981"/>
  <circle cx="250" cy="180" r="8" fill="#3B82F6"/>
  <circle cx="350" cy="160" r="8" fill="#F59E0B"/>
  <circle cx="400" cy="200" r="8" fill="#EF4444"/>
  <circle cx="300" cy="220" r="8" fill="#8B5CF6"/>
  
  <!-- 连接线 -->
  <line x1="200" y1="150" x2="250" y2="180" stroke="#10B981" stroke-width="2" opacity="0.6"/>
  <line x1="250" y1="180" x2="350" y2="160" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="160" x2="400" y2="200" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="200" x2="300" y2="220" stroke="#EF4444" stroke-width="2" opacity="0.6"/>
  
  <!-- 语言标签 -->
  <rect x="100" y="300" width="40" height="15" rx="7" fill="#DDD6FE"/>
  <text x="120" y="310" text-anchor="middle" fill="#A855F7" font-size="8">EN</text>
  
  <rect x="160" y="300" width="40" height="15" rx="7" fill="#DBEAFE"/>
  <text x="180" y="310" text-anchor="middle" fill="#3B82F6" font-size="8">中文</text>
  
  <rect x="220" y="300" width="40" height="15" rx="7" fill="#FEF3C7"/>
  <text x="240" y="310" text-anchor="middle" fill="#F59E0B" font-size="8">ES</text>
  
  <rect x="280" y="300" width="40" height="15" rx="7" fill="#FEE2E2"/>
  <text x="300" y="310" text-anchor="middle" fill="#EF4444" font-size="8">FR</text>
  
  <rect x="340" y="300" width="40" height="15" rx="7" fill="#F3E8FF"/>
  <text x="360" y="310" text-anchor="middle" fill="#8B5CF6" font-size="8">DE</text>
  
  <!-- 成功指示 -->
  <text x="480" y="120" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold">5+</text>
  <text x="480" y="135" text-anchor="middle" fill="#6B7280" font-size="8">国家</text>
</svg> 