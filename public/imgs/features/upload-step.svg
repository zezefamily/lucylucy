<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="12" fill="#F9FAFB"/>
  <rect x="50" y="50" width="500" height="300" rx="8" fill="#F3F4F6"/>
  
  <!-- 上传区域 -->
  <rect x="200" y="120" width="200" height="160" rx="12" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- 上传图标 -->
  <circle cx="300" cy="180" r="25" fill="#DDD6FE"/>
  <rect x="290" y="170" width="20" height="2" rx="1" fill="#A855F7"/>
  <rect x="299" y="160" width="2" height="20" rx="1" fill="#A855F7"/>
  <polygon points="295,168 300,163 305,168" fill="#A855F7"/>
  
  <!-- 文字线条模拟 -->
  <rect x="230" y="220" width="140" height="4" rx="2" fill="#D1D5DB"/>
  <rect x="250" y="235" width="100" height="3" rx="1.5" fill="#E5E7EB"/>
  <rect x="260" y="250" width="80" height="3" rx="1.5" fill="#E5E7EB"/>
  
  <!-- 装饰箭头 -->
  <polygon points="150,200 170,195 170,205" fill="#C4B5FD"/>
  <polygon points="450,200 430,195 430,205" fill="#C4B5FD"/>
</svg> 