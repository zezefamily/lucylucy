<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="12" fill="#F9FAFB"/>
  <rect x="50" y="50" width="500" height="300" rx="8" fill="#F3F4F6"/>
  
  <!-- AI大脑中心 -->
  <circle cx="300" cy="200" r="60" fill="#DDD6FE"/>
  <circle cx="300" cy="200" r="40" fill="#C4B5FD"/>
  <text x="300" y="206" text-anchor="middle" fill="#A855F7" font-size="16" font-weight="bold">AI</text>
  
  <!-- 分析过程指示器 -->
  <circle cx="200" cy="150" r="8" fill="#10B981">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="150" r="8" fill="#F59E0B">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="250" r="8" fill="#EF4444">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="250" r="8" fill="#3B82F6">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 数据流线条 -->
  <path d="M220 150 Q260 170 290 160" stroke="#D1D5DB" stroke-width="2" fill="none"/>
  <path d="M380 150 Q340 170 310 160" stroke="#D1D5DB" stroke-width="2" fill="none"/>
  <path d="M220 250 Q260 230 290 240" stroke="#D1D5DB" stroke-width="2" fill="none"/>
  <path d="M380 250 Q340 230 310 240" stroke="#D1D5DB" stroke-width="2" fill="none"/>
  
  <!-- 分析结果 -->
  <rect x="450" y="180" width="80" height="40" rx="8" fill="#F3F4F6"/>
  <rect x="460" y="190" width="60" height="4" rx="2" fill="#D1D5DB"/>
  <rect x="460" y="200" width="40" height="4" rx="2" fill="#E5E7EB"/>
</svg> 